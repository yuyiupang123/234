<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>音訊 → 重點整理、心智圖與 AI 對話</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
      --success: #4ade80; --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.7;
      min-height: 100vh; padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px; margin-bottom: 20px;
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; }
    input[type="file"], input[type="text"] {
      width: 100%; background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 12px; font-size: 0.95rem;
    }
    input[type="text"]:focus {
      outline: none; border-color: var(--accent);
    }
    .btn {
      background: var(--accent); color: #0f172a; border: none;
      border-radius: 8px; padding: 12px 28px; font-weight: 600;
      font-size: 1rem; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-danger {
      background: #7f1d1d; color: #fca5a5; border: none; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; cursor: pointer;
    }
    #status {
      margin-top: 14px; font-size: 0.95rem; min-height: 28px;
      padding: 8px 12px; border-radius: 6px;
    }
    #status.error { background: #450a0a; color: var(--danger); }
    #status.success { background: #052e16; color: var(--success); }
    #status.info { background: #0c4a6e; color: var(--accent); }
    #timing {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 24px;
      display: none;
    }
    #timing.visible { display: block; }
    #timing .elapsed {
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    #timing.done .elapsed { color: var(--success); }
    #fileInfo {
      margin-top: 14px;
      padding: 14px 16px;
      background: #0c4a6e;
      border: 1px solid #38bdf8;
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text);
      display: none;
    }
    #fileInfo.visible { display: block; }
    #fileInfo .size { color: #e2e8f0; font-weight: 600; }
    #fileInfo .estimate {
      color: #7dd3fc;
      font-weight: 700;
      font-size: 1.05rem;
    }
    #fileInfo .note {
      font-size: 0.82rem;
      margin-top: 6px;
      color: #94a3b8;
    }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 18px;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap;
    }
    .tab {
      background: transparent; border: none; color: var(--muted);
      padding: 8px 16px; cursor: pointer; border-radius: 6px; font-size: 0.95rem;
      transition: all 0.2s;
    }
    .tab.active { background: #334155; color: var(--text); }
    .panel { display: none; }
    .panel.active { display: block; }

    #mindmap-container {
      width: 100%; height: 580px; background: #0f172a;
      border-radius: 8px; overflow: hidden;
    }
    #mindmap-container svg { width: 100%; height: 100%; }
    #mindmap-container foreignObject div,
    #mindmap-container foreignObject span,
    #mindmap-container text {
      color: #f8fafc !important;
      fill: #f8fafc !important;
      font-size: 14px !important;
      font-weight: 500 !important;
    }

    .hint { font-size: 0.82rem; color: var(--muted); margin-top: 8px; }

    .points-wrap { display: flex; flex-direction: column; gap: 14px; }
    .point-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 18px 16px 20px;
    }
    .point-num {
      display: inline-block;
      background: #0c4a6e;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .point-text {
      font-size: 1.02rem;
      line-height: 1.75;
      color: var(--text);
    }

    .notes-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      line-height: 1.8;
    }
    .notes-box h1 {
      font-size: 1.3rem; margin: 22px 0 10px; color: var(--accent);
      border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .notes-box h1:first-child { margin-top: 0; }
    .notes-box h2 { font-size: 1.12rem; margin: 16px 0 8px; color: #7dd3fc; }
    .notes-box h3 { font-size: 1.02rem; margin: 12px 0 6px; color: #a5f3fc; }
    .notes-box p { margin-bottom: 10px; color: var(--text); }
    .notes-box ul, .notes-box ol { padding-left: 22px; margin-bottom: 12px; }
    .notes-box li { margin-bottom: 6px; }
    .notes-box code {
      background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 0.9em;
    }
    .empty-hint { color: var(--muted); font-size: 0.95rem; padding: 12px 0; }

    .raw-transcript-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .raw-transcript-box .point-num { margin-bottom: 10px; }
    .raw-transcript-body {
      white-space: pre-wrap;
      line-height: 1.85;
      font-size: 0.98rem;
      color: var(--text);
      max-height: 520px;
      overflow: auto;
    }

    /* ========== Gemini 風格 AI 聊天室介面 ========== */
    .chat-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      max-width: 90%;
    }
    .chat-message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-message-row.ai {
      align-self: flex-start;
    }
    .chat-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      font-weight: bold;
    }
    .chat-message-row.user .chat-avatar {
      background: #38bdf8;
      color: #0f172a;
    }
    .chat-message-row.ai .chat-avatar {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .chat-bubble {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.98rem;
      line-height: 1.75;
      word-break: break-word;
    }
    .chat-message-row.user .chat-bubble {
      background: #1e3a8a;
      color: #e2e8f0;
      border-top-right-radius: 2px;
      border: 1px solid #3b82f6;
    }
    .chat-message-row.ai .chat-bubble {
      background: #1e293b;
      color: var(--text);
      border-top-left-radius: 2px;
      border: 1px solid var(--border);
    }
    .chat-bubble p { margin-bottom: 10px; }
    .chat-bubble p:last-child { margin-bottom: 0; }
    .chat-bubble ul, .chat-bubble ol { padding-left: 20px; margin-bottom: 10px; }
    .chat-bubble li { margin-bottom: 5px; }
    .chat-bubble strong { color: var(--accent); font-weight: 600; }
    .chat-bubble code {
      background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; border: 1px solid var(--border);
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 8px;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      align-items: center;
    }
    .chat-input-area input {
      background: transparent;
      border: none;
      padding: 8px;
      font-size: 0.98rem;
    }
    .chat-input-area input:focus {
      outline: none;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .history-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .history-info {
      cursor: pointer;
      flex: 1;
    }
    .history-title {
      font-weight: 600;
      color: var(--accent);
      font-size: 0.98rem;
      margin-bottom: 4px;
    }
    .history-meta {
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎧 音訊 → 重點整理與心智圖</h1>
    <p class="subtitle">上傳音訊，自動轉錄並產生重點、筆記與心智圖（支援長音訊分段處理、Gemini 風格 AI 對話與歷史紀錄搜尋）</p>

    <!-- 歷史紀錄查詢卡片 -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
        <label style="margin-bottom: 0; font-weight: 600; color: var(--text);">📂 歷史紀錄與搜尋</label>
        <button class="btn btn-secondary" id="toggleHistoryBtn" style="padding: 6px 14px; font-size: 0.88rem;">展開／收合紀錄</button>
      </div>
      <div id="historySection" style="display: none;">
        <div style="margin-bottom: 12px;">
          <input type="text" id="historySearchInput" placeholder="輸入關鍵字搜尋歷史紀錄..." />
        </div>
        <div class="history-list" id="historyListContainer">
          <div class="empty-hint">尚無歷史紀錄</div>
        </div>
      </div>
    </div>

    <div class="card">
      <label>選擇音訊檔案（支援 MP3、WAV、M4A、OGG 等）</label>
      <input type="file" id="audioFile" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm,.flac" />
      <div class="hint">建議單一檔案不超過 25MB。超過約 30 分鐘的內容會自動分段整理，完整保留逐字稿。</div>
      
      <!-- 雙模型聯合分析選項 -->
      <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="dualModelCheckbox" checked style="width: auto; cursor: pointer;" />
        <label for="dualModelCheckbox" style="display: inline; margin-bottom: 0; cursor: pointer; color: var(--text);">啟用雙模型聯合分析（使用 V3.2-Ultra 多方言轉寫 + Diarize-V3.0 聲紋人物分離）</label>
      </div>

      <div id="fileInfo"></div>

      <div style="margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap;">
        <button class="btn" id="generateBtn">開始產生重點與心智圖</button>
        <button class="btn btn-secondary" id="clearBtn">清除</button>
      </div>
      <div id="status"></div>
      <div id="timing"></div>
    </div>

    <div class="card" id="results" style="display: none;">
      <div class="tabs">
        <button class="tab active" data-tab="points">重點內容</button>
        <button class="tab" data-tab="notes">整理筆記</button>
        <button class="tab" data-tab="mindmap">心智圖</button>
        <button class="tab" data-tab="transcript">逐字稿</button>
        <button class="tab" data-tab="chat">✨ AI 檔案對話</button>
      </div>

      <div id="panel-points" class="panel active">
        <div class="points-wrap" id="pointsList"></div>
      </div>
      <div id="panel-notes" class="panel">
        <div class="notes-box" id="notesContent"></div>
      </div>
      <div id="panel-mindmap" class="panel">
        <div id="mindmap-container"></div>
      </div>
      <div id="panel-transcript" class="panel">
        <div id="transcriptBox"></div>
      </div>
      <div id="panel-chat" class="panel">
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-message-row ai">
              <div class="chat-avatar">AI</div>
              <div class="chat-bubble">
                <p>你好！我是基於此音訊檔案內容的 <strong>Gemini 智慧助手</strong>。你可以隨時向我提問關於這個檔案的細節、要求詳細解釋或進行延伸討論！</p>
              </div>
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="向 AI 詢問關於此檔案的任何問題..." />
            <button class="btn" id="sendChatBtn" style="padding: 10px 20px;">發送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== 矽基流動設定 ==========
    const API_BASE_URL = "https://api.siliconflow.cn/v1";
    const API_KEY      = "sk-kqrsiandfirxhbknbthmkibjqlqncpwdyqpqxtinddzkpigz";
    const WHISPER_MODEL = "XingChenAGI/XingChenASR-V3.2-Ultra"; // 專精高準確度文字與多方言
    const DIARIZE_MODEL = "XingChenAGI/XingChenASR-Diarize-V3.0"; // 專精聲紋說話者分離
    const LLM_MODEL      = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";
    // ==================================

    const CHUNK_SIZE = 10000;
    const CHUNK_OVERLAP = 300;

    const $ = id => document.getElementById(id);
    let currentMarkmap = null;
    let pendingMindmapMd = null;
    let currentFileName = '';
    let currentTimestamp = null;
    let currentFullData = null;
    let currentChatHistory = [];
    const converter = OpenCC.Converter({ from: 'cn', to: 'hk' });

    // ========== 歷史紀錄相關函式 ==========
    const STORAGE_KEY = 'audio_mindmap_history_v1';

    function getHistory() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistoryItem(item) {
      const history = getHistory();
      history.unshift(item);
      if (history.length > 20) history.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistoryList();
    }

    function deleteHistoryItem(timestamp, event) {
      event.stopPropagation();
      let history = getHistory();
      history = history.filter(h => h.timestamp !== timestamp);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistoryList();
    }

    function renderHistoryList(filterKeyword = '') {
      const container = $('historyListContainer');
      const history = getHistory();
      const filtered = history.filter(h => 
        h.fileName.toLowerCase().includes(filterKeyword.toLowerCase()) ||
        (h.summaryText && h.summaryText.toLowerCase().includes(filterKeyword.toLowerCase()))
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-hint">沒有找到符合的歷史紀錄</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const dateStr = new Date(item.timestamp).toLocaleString();
        div.innerHTML = `
          <div class="history-info">
            <div class="history-title">🎵 ${escapeHtml(item.fileName)}</div>
            <div class="history-meta">時間：${dateStr} ｜ 約 ${(item.transcript || '').length} 字</div>
          </div>
          <button class="btn-danger" onclick="window.loadHistoryRecord(${item.timestamp}, event)">載入</button>
          <button class="btn-danger" style="background:#450a0a; color:#f87171;" onclick="window.removeHistoryRecord(${item.timestamp}, event)">刪除</button>
        `;
        container.appendChild(div);
      });
    }

    window.loadHistoryRecord = function(timestamp, event) {
      event.stopPropagation();
      const history = getHistory();
      const record = history.find(h => h.timestamp === timestamp);
      if (!record) return;

      currentFileName = record.fileName;
      currentTimestamp = record.timestamp;
      currentFullData = record.data;
      currentChatHistory = record.chatHistory || [];

      renderPoints(currentFullData.points);
      renderNotes(currentFullData.notesMd);
      renderTranscript(currentFullData.transcriptText, record.transcript);
      pendingMindmapMd = currentFullData.mindmapMd || null;

      renderChatMessages();

      $('results').style.display = 'block';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelector('[data-tab="points"]').classList.add('active');
      $('panel-points').classList.add('active');

      setStatus(`已成功載入歷史紀錄：${record.fileName}`, 'success');
    };

    window.removeHistoryRecord = function(timestamp, event) {
      deleteHistoryItem(timestamp, event);
    };

    $('toggleHistoryBtn').addEventListener('click', () => {
      const sec = $('historySection');
      sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    });

    $('historySearchInput').addEventListener('input', (e) => {
      renderHistoryList(e.target.value);
    });

    function estimateProcessTime(sizeBytes) {
      const sizeMB = sizeBytes / (1024 * 1024);
      const estChunks = Math.max(1, Math.ceil((sizeMB * 2500) / CHUNK_SIZE));
      let lowSec  = Math.round(30 + sizeMB * 12 + (estChunks - 1) * 25);
      let highSec = Math.round(50 + sizeMB * 22 + (estChunks - 1) * 45);
      lowSec  = Math.max(25, lowSec);
      highSec = Math.max(lowSec + 20, highSec);
      if (sizeMB > 20) highSec = Math.round(highSec * 1.25);
      return { lowSec, highSec, sizeMB, estChunks };
    }

    function formatDuration(sec) {
      const s = Math.max(0, Math.round(sec));
      const min = Math.floor(s / 60);
      const remain = s % 60;
      if (min > 0) return remain > 0 ? `${min} 分 ${remain} 秒` : `${min} 分`;
      return `${remain} 秒`;
    }

    function formatDurationMs(ms) {
      return formatDuration(ms / 1000);
    }

    function showFileInfo(file) {
      const el = $('fileInfo');
      if (!file) {
        el.classList.remove('visible');
        el.innerHTML = '';
        return;
      }
      const { lowSec, highSec, sizeMB, estChunks } = estimateProcessTime(file.size);
      const sizeStr = sizeMB < 1
        ? `${(file.size / 1024).toFixed(1)} KB`
        : `${sizeMB.toFixed(2)} MB`;
      const chunkHint = estChunks > 1
        ? `<br>📑 預估將分成約 <span class="estimate">${estChunks}</span> 段整理（完整保留逐字稿）`
        : '';
      el.innerHTML = `
        📁 檔案大小：<span class="size">${sizeStr}</span><br>
        ⏱ 預計等候時間（產生報告前）：<span class="estimate">約 ${formatDuration(lowSec)} ～ ${formatDuration(highSec)}</span>
        ${chunkHint}
        <div class="note">此為根據檔案大小估算的載入／處理時間。長音訊會自動分段，實際時間會因音訊長度與伺服器負載而有所差異。</div>
      `;
      el.classList.add('visible');
    }

    let startTime = null;
    let timerInterval = null;

    function startTimer() {
      startTime = Date.now();
      const el = $('timing');
      el.classList.add('visible');
      el.classList.remove('done');
      el.innerHTML = `⏳ 處理中… 已用時 <span class="elapsed">0 秒</span>`;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        el.innerHTML = `⏳ 處理中… 已用時 <span class="elapsed">${formatDurationMs(elapsed)}</span>`;
      }, 1000);
    }

    function stopTimer(success = true) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (!startTime) return;
      const elapsed = Date.now() - startTime;
      const el = $('timing');
      el.classList.add('visible');
      el.classList.add('done');
      el.innerHTML = success

    function escapeHtml(str) {

    function splitTranscriptIntoChunks(text, maxLen = CHUNK_SIZE, overlap = CHUNK_OVERLAP) {
      const cleaned = (text || '').trim();
      if (!cleaned) return [];
      if (cleaned.length <= maxLen) return [cleaned];

      const chunks = [];
      let start = 0;
      while (start < cleaned.length) {
        let end = Math.min(start + maxLen, cleaned.length);
        if (end < cleaned.length) {
          const slice = cleaned.slice(start, end);
          const breakPts = ['。', '？', '！', '；', '\n', '.', '?', '!'];
          let best = -1;
          for (const bp of breakPts) {
            const idx = slice.lastIndexOf(bp);
            if (idx > maxLen * 0.55 && idx > best) best = idx;
          }
          if (best > 0) end = start + best + 1;
        }
        chunks.push(cleaned.slice(start, end).trim());
        if (end >= cleaned.length) break;
        start = Math.max(start + 1, end - overlap);
      }
      return chunks.filter(c => c.length > 0);
    }

      const res = await fetch(`${API_BASE_URL}/chat/completions`, {

    function parseAIResponse(text) {
      let points = [];
      let notesMd = '';
      let mindmapMd = '';
      let transcriptText = '';

      const pointsMatch = text.match(/【重點內容】([\s\S]*?)(?=【整理筆記】|【心智圖】|【逐字稿|$)/i);
      const notesMatch = text.match(/【整理筆記】([\s\S]*?)(?=【心智圖】|【逐字稿|$)/i);
      const mindMatch = text.match(/【心智圖】([\s\S]*?)(?=【逐字稿|$)/i);
      const transcriptMatch = text.match(/【逐字稿】([\s\S]*)/i);

      if (pointsMatch) {
        points = pointsMatch[1]
          .split('\n')
          .map(line => line.replace(/^[-•*]\s*/, '').replace(/^\d+[\.、]\s*/, '').trim())
          .filter(line => line.length > 4);
      }
      if (notesMatch) {
        notesMd = notesMatch[1].trim()
          .replace(/^```(?:markdown)?\s*/i, '')
          .replace(/```$/, '')
          .trim();
      }
      if (mindMatch) {
        mindmapMd = mindMatch[1].trim()
          .replace(/^```(?:markdown)?\s*/i, '')
          .replace(/```$/, '')
          .trim();
      } else if (notesMd) {
        mindmapMd = notesMd;
      }
      if (transcriptMatch) {
        transcriptText = transcriptMatch[1].trim();
      }
      return { points, notesMd, mindmapMd, transcriptText };
    }

    function mergeChunkResults(results, fullRawTranscript) {
      const allPoints = [];
      const notesParts = [];
      let mindmapMd = '';

      results.forEach((r, i) => {
        r.points.forEach(p => allPoints.push(p));
        if (r.notesMd) {
          if (results.length > 1) {
            notesParts.push(`# 第 ${i + 1} 段內容\n\n${r.notesMd}`);
          } else {
            notesParts.push(r.notesMd);
          }
        }
        if (!mindmapMd && r.mindmapMd) mindmapMd = r.mindmapMd;
      });

      return {
        points: allPoints,
        notesMd: notesParts.join('\n\n---\n\n'),
        mindmapMd,
        transcriptText: fullRawTranscript
      };
    }

      if (total === 1) {
        setStatus('② 正在整理重點與心智圖（繁體中文）…', 'info');

        const aiText = await generateChunkContent(chunks[i], i, total);
        results.push(parseAIResponse(aiText));
      }

      setStatus('③ 正在合併各段並產生統一心智圖…', 'info');

    }

    function simpleMarkdownToHtml(md) {
      if (!md) return '<p class="empty-hint">尚無內容</p>';
      let html = escapeHtml(md);
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
      html = html.replace(/\n{2,}/g, '</p><p>');
      html = '<p>' + html + '</p>';
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>(<h[1-3]>)/g, '$1');
      html = html.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
      html = html.replace(/<p>(<ul>)/g, '$1');
      html = html.replace(/(<\/ul>)<\/p>/g, '$1');
      return html;
    }

    function renderTranscript(text, rawFallback) {
      const content = (text && text.length > 10) ? text : rawFallback;
      const charCount = (content || '').length;
      const approxMin = Math.max(1, Math.round(charCount / 180));

      const speakerMatches = Array.from(content.matchAll(/(?:^|\n)(\d+):/g));
      const uniqueSpeakers = [...new Set(speakerMatches.map(m => m[1]))].sort((a,b) => a - b);

      let speakerHeaderHtml = '';
      if (uniqueSpeakers.length > 0) {
        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        const tags = uniqueSpeakers.map((sp, idx) => {
          const label = letters[idx] || sp;
          return `<span style="background: #0c4a6e; color: #38bdf8; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; border: 1px solid #0284c7;">說話者 ${label} (編號 ${sp})</span>`;
        }).join(' ');

        speakerHeaderHtml = `
          <div style="margin-bottom: 14px; padding: 12px; background: #1e293b; border-radius: 8px; border: 1px solid var(--border);">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 6px;">👥 偵測到的說話者列表：</div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">${tags}</div>
          </div>
        `;
      }

      let formattedBody = escapeHtml(content);
      if (uniqueSpeakers.length > 0) {
        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        uniqueSpeakers.forEach((sp, idx) => {
          const label = letters[idx] || sp;
          const reg = new RegExp(`(?:^|\\n)${sp}:`, 'g');
          formattedBody = formattedBody.replace(reg, `\n\n<strong style="color: #38bdf8; display: inline-block; margin-top: 8px;">【說話者 ${label}】</strong> `);
        });
      }

      $('transcriptBox').innerHTML = `
        <div class="raw-transcript-box">
          <span class="point-num">完整逐字稿（約 ${charCount.toLocaleString()} 字｜約 ${approxMin} 分鐘）</span>
          ${speakerHeaderHtml}
          <div class="raw-transcript-body" style="line-height: 1.8;">${formattedBody.trim()}</div>
        </div>
      `;
    }

            model: LLM_MODEL,
            messages: messages,
            temperature: 0.4,
            max_tokens: 3000
          })
        });

        if (!res.ok) {
          throw new Error('對話請求失敗');
        }

        const data = await res.json();
        let aiReply = data.choices[0].message.content.trim();
        aiReply = converter(aiReply);

        currentChatHistory.push({ role: 'assistant', content: aiReply });
        updateCurrentHistoryChat();

      } catch (err) {
        console.error(err);
        currentChatHistory.push({ role: 'assistant', content: '抱歉，發生了一點錯誤，請稍後再試。' });
      }
      renderChatMessages();
    }

    function updateCurrentHistoryChat() {
      if (!currentTimestamp) return;
      const history = getHistory();
      const item = history.find(h => h.timestamp === currentTimestamp);
      if (item) {
        item.chatHistory = currentChatHistory;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      }
    }

    $('sendChatBtn').addEventListener('click', sendChatMessage);
    $('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });

    // ========== 心智圖 ==========
    window.renderMarkmap = function(markdown) {
      try {
        if (!markdown || !String(markdown).trim()) return;
        const container = $('mindmap-container');
        if (container.clientWidth < 10 || container.clientHeight < 10) {
          pendingMindmapMd = markdown;
          return;
        }
        const { Transformer, Markmap } = window.markmap;
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        container.innerHTML = '';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '100%');
        svg.setAttribute('height', '100%');
        container.appendChild(svg);
        if (currentMarkmap) {
          try { currentMarkmap.destroy(); } catch (e) {}
          currentMarkmap = null;
        }
        currentMarkmap = Markmap.create(svg, {
          autoFit: true,
          duration: 400,
          maxWidth: 360,
          colorFreezeLevel: 2,
          paddingX: 12,
          spacingVertical: 12,
          spacingHorizontal: 80,
          style: (id) => `
            ${id} { --markmap-text-color: #f8fafc; }
            ${id} a { color: #f8fafc; }
            ${id} foreignObject > div {
              color: #f8fafc !important;
              font-size: 14px !important;
              font-weight: 500 !important;
              line-height: 1.4 !important;
              text-shadow: 0 1px 2px rgba(0,0,0,0.65);
            }
            ${id} circle { stroke-width: 2px; }
          `
        }, root);
        setTimeout(() => { if (currentMarkmap) currentMarkmap.fit(); }, 100);
        pendingMindmapMd = markdown;
      } catch (e) {
        console.error('心智圖渲染失敗', e);
      }
    };

    // ========== 主流程 ==========
    $('generateBtn').addEventListener('click', async () => {
      setStatus('開始檢查…', 'info');
      const file = $('audioFile').files[0];
      if (!file) {
        setStatus('請先選擇音訊檔案', 'error');
        return;
      }
      if (!API_KEY || API_KEY.length < 10) {
        setStatus('請先在 HTML 中填入正確的 API_KEY', 'error');
        return;
      }

      currentFileName = file.name;
      currentTimestamp = Date.now();
      const btn = $('generateBtn');
      btn.disabled = true;
      $('results').style.display = 'none';
      pendingMindmapMd = null;
      if (currentMarkmap) {
        try { currentMarkmap.destroy(); } catch (e) {}
        currentMarkmap = null;
      }
      $('mindmap-container').innerHTML = '';
      startTimer();

      try {
        const transcript = await transcribeDualMode(file);
        if (!transcript || transcript.trim().length < 5) {
          throw new Error('語音轉文字結果為空，請確認音訊是否清晰、有人聲');
        }

        const sizeMB = file.size / (1024 * 1024);
        const expectedMinChars = sizeMB * 800;
        if (sizeMB > 8 && transcript.length < expectedMinChars * 0.25) {
          console.warn('ASR 回傳字數相對檔案大小偏少，可能被服務端截斷');
          setStatus(`① 轉寫完成（${transcript.length} 字）。注意：檔案較大但字數偏少，ASR 可能有時長限制。繼續分段整理…`, 'info');
          await new Promise(r => setTimeout(r, 800));
        }

        const parsedResult = await generateContentSegmented(transcript);
        currentFullData = parsedResult;
        currentChatHistory = [];

        renderPoints(parsedResult.points);
        renderNotes(parsedResult.notesMd);
        renderTranscript(parsedResult.transcriptText, transcript);
        pendingMindmapMd = parsedResult.mindmapMd || null;

        renderChatMessages();

        saveHistoryItem({
          fileName: currentFileName,
          timestamp: currentTimestamp,
          transcript: transcript,
          summaryText: parsedResult.notesMd.slice(0, 100),
          data: parsedResult,
          chatHistory: []
        });

        const activeTab = document.querySelector('.tab.active');
        if (activeTab && activeTab.dataset.tab === 'mindmap') {
          setTimeout(() => window.renderMarkmap(pendingMindmapMd), 100);
        }

        $('results').style.display = 'block';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelector('[data-tab="points"]').classList.add('active');
        $('panel-points').classList.add('active');

        stopTimer(true);
        const chunkInfo = transcript.length > CHUNK_SIZE
          ? `（原文 ${transcript.length.toLocaleString()} 字，已分段整理）`
          : '';
        setStatus(`完成！已產生重點、筆記、完整逐字稿${chunkInfo}。請點「心智圖」或「AI 檔案對話」。`, 'success');
      } catch (err) {
        console.error(err);
        stopTimer(false);
        setStatus(err.message || '發生錯誤', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    $('clearBtn').addEventListener('click', () => {
      $('audioFile').value = '';
      $('transcriptBox').innerHTML = '';
      $('pointsList').innerHTML = '';
      $('notesContent').innerHTML = '';
      $('mindmap-container').innerHTML = '';
      $('results').style.display = 'none';
      setStatus('');
      resetTimer();
      showFileInfo(null);
      pendingMindmapMd = null;
      currentFileName = '';
      currentTimestamp = null;
      currentFullData = null;
      currentChatHistory = [];
      if (currentMarkmap) {
        try { currentMarkmap.destroy(); } catch (e) {}
        currentMarkmap = null;
      }
    });

    renderHistoryList();
    setStatus('準備就緒，請選擇音訊檔案', 'info');
  </script>
</body>
</html>
